name: macOS release build

# Builds the universal (arm64 + x64) macOS .app on a real macOS runner — the bundling,
# lipo, dylib fix-ups and ad-hoc signing all need macOS tooling that the Windows/Linux
# packaging can't provide. Fires automatically when a release is published, and can be
# re-run by hand against an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the macOS build to (e.g. v1.7.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    # Only real versions (v1.2.3). Utility releases such as build-deps must not start a build.
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag, 'v')
    runs-on: macos-14
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: LibHac feed fallback
        # Ryujinx.LibHac pre-releases only exist on git.ryujinx.app. When that feed is down the
        # restore times out and the whole build fails (1.8.8 shipped without macOS for that
        # reason). Fall back to the copy mirrored on the build-deps release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl -sf -m 20 -o /dev/null https://git.ryujinx.app/api/packages/projects/nuget/index.json; then
            echo "git.ryujinx.app reachable, using it"; exit 0
          fi
          echo "::warning::git.ryujinx.app unreachable, using the LibHac package mirrored on the build-deps release"
          mkdir -p "$RUNNER_TEMP/libhac"
          gh release download build-deps -R "$GITHUB_REPOSITORY" -p "ryujinx.libhac.*.nupkg" -D "$RUNNER_TEMP/libhac"
          ls -la "$RUNNER_TEMP/libhac"
          dotnet nuget update source LibHacAlpha --source "$RUNNER_TEMP/libhac" --configfile nuget.config

      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building macOS $VERSION for tag $TAG"

      - name: Bake server addresses + client identity + stamp version
        env:
          NEXTENDO_SERVER_IP: ${{ secrets.NEXTENDO_SERVER_IP }}
          NEXTENDO_NAT_IP: ${{ secrets.NEXTENDO_NAT_IP }}
          NEXTENDO_OFFICIAL_CLIENT_ID: ${{ secrets.NEXTENDO_OFFICIAL_CLIENT_ID }}
        run: |
          if [ -z "$NEXTENDO_SERVER_IP" ] || [ -z "$NEXTENDO_NAT_IP" ]; then
            echo "::error::NEXTENDO_SERVER_IP / NEXTENDO_NAT_IP secrets are not set"; exit 1
          fi
          if [ -z "$NEXTENDO_OFFICIAL_CLIENT_ID" ]; then
            echo "::error::NEXTENDO_OFFICIAL_CLIENT_ID secret is not set — the app would fail to compile (NextendoAppSecrets is gitignored, never checked out) or connect (closed-API gate rejects an unregistered client_id)"; exit 1
          fi
          python3 distribution/nextendo/bake_release.py "${{ steps.ver.outputs.version }}" "${{ github.sha }}"

      - name: Build universal macOS .app
        run: |
          chmod +x distribution/macos/*.sh
          ./distribution/macos/create_macos_build_ava.sh \
            "$PWD" macos_tmp macos_out \
            distribution/macos/entitlements.xml \
            "${{ steps.ver.outputs.version }}" "${{ github.sha }}" Release 0

      - name: Rename artifact
        id: art
        run: |
          SRC=$(ls macos_out/ryujinx-*-macos_universal.app.tar.gz | head -n1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::macOS build produced no artifact"; ls -la macos_out || true; exit 1
          fi
          DST="Ryujinx-Nextendo-${{ steps.ver.outputs.version }}-macos_universal.tar.gz"
          mv "$SRC" "$DST"
          echo "file=$DST" >> "$GITHUB_OUTPUT"
          ls -la "$DST"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.art.outputs.file }}" \
            --clobber --repo "${{ github.repository }}"
